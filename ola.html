<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guía de Supervivencia Familiar</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #1a3a5c, #2d6a8f);
            min-height: 100vh;
            padding: 20px;
            color: #fff;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255,255,255,0.08);
            border-radius: 20px;
            padding: 30px;
            backdrop-filter: blur(5px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        h1 { text-align: center; margin-bottom: 8px; font-size: 1.8rem; }
        .subtitle { text-align: center; opacity: 0.8; margin-bottom: 25px; }
        .step-title { font-size: 1.3rem; margin-bottom: 20px; text-align: center; }
        
        .family-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }
        .member-card {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            border: 2px solid transparent;
            transition: all 0.3s;
        }
        .member-card .emoji { font-size: 2.5rem; display: block; margin-bottom: 8px; }
        .member-card .name { font-weight: bold; margin-bottom: 10px; }
        .counter {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        .counter button {
            width: 36px; height: 36px;
            border-radius: 50%;
            border: none;
            background: #ff9f43;
            color: #fff;
            font-size: 1.3rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .counter button:hover { transform: scale(1.1); }
        .counter button:disabled { background: #555; cursor: not-allowed; }
        .counter .value { font-size: 1.4rem; min-width: 30px; font-weight: bold; }
        
        .next-btn {
            display: block;
            margin: 0 0 0 auto;
            padding: 12px 30px;
            background: #ff9f43;
            color: #fff;
            border: none;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        .next-btn:hover { background: #ffb86c; transform: translateY(-2px); }
        .next-btn:disabled { background: #555; cursor: not-allowed; transform: none; }
        
        .info-box {
            background: rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 18px;
            margin: 12px 0;
        }
        .info-box h3 { margin-bottom: 8px; color: #ffd166; }
        .info-box p { margin: 5px 0; line-height: 1.5; }
        
        .warning { background: rgba(255, 107, 107, 0.2); border-left: 4px solid #ff6b6b; }
        .good { background: rgba(72, 187, 120, 0.2); border-left: 4px solid #48bb78; }
        
        .hidden { display: none; }
        
        .summary-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin: 20px 0;
        }
        .plan-btn {
            display: block;
            width: 100%;
            padding: 15px;
            background: #48bb78;
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            transition: all 0.3s;
        }
        .plan-btn:hover { background: #5cd08a; transform: translateY(-2px); }
        
        table { width: 100%; border-collapse: collapse; margin: 10px 0; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.2); }
        th { color: #ffd166; }
        
        .reset-btn {
            display: block;
            margin: 20px auto 0;
            padding: 10px 25px;
            background: transparent;
            border: 2px solid #ff9f43;
            color: #ff9f43;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
        }
        .reset-btn:hover { background: #ff9f43; color: #fff; }
        
        @media (max-width: 500px) {
            .summary-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏠 Guía de Supervivencia Familiar</h1>
        <p class="subtitle">Planifica tu hogar ante sismos, huaycos e incendios</p>

        <!-- PASO 1: Selecciona tu hogar -->
        <div id="step1">
            <h2 class="step-title">👨‍👩‍👧‍👦 Selecciona tu hogar</h2>
            <p style="text-align:center; opacity:0.8; margin-bottom:20px;">Elige cuántas personas y mascotas viven contigo (0 a 5 de cada uno):</p>
            
            <div class="family-grid">
                <div class="member-card">
                    <span class="emoji">👨</span>
                    <div class="name">Adultos</div>
                    <div class="counter">
                        <button onclick="changeCount('adultos', -1)">−</button>
                        <span class="value" id="val-adultos">0</span>
                        <button onclick="changeCount('adultos', 1)">+</button>
                    </div>
                </div>
                <div class="member-card">
                    <span class="emoji">👴</span>
                    <div class="name">Adultos mayores</div>
                    <div class="counter">
                        <button onclick="changeCount('mayores', -1)">−</button>
                        <span class="value" id="val-mayores">0</span>
                        <button onclick="changeCount('mayores', 1)">+</button>
                    </div>
                </div>
                <div class="member-card">
                    <span class="emoji">🧒</span>
                    <div class="name">Niños</div>
                    <div class="counter">
                        <button onclick="changeCount('ninos', -1)">−</button>
                        <span class="value" id="val-ninos">0</span>
                        <button onclick="changeCount('ninos', 1)">+</button>
                    </div>
                </div>
                <div class="member-card">
                    <span class="emoji">🐕</span>
                    <div class="name">Perros</div>
                    <div class="counter">
                        <button onclick="changeCount('perros', -1)">−</button>
                        <span class="value" id="val-perros">0</span>
                        <button onclick="changeCount('perros', 1)">+</button>
                    </div>
                </div>
                <div class="member-card">
                    <span class="emoji">🐈</span>
                    <div class="name">Gatos</div>
                    <div class="counter">
                        <button onclick="changeCount('gatos', -1)">−</button>
                        <span class="value" id="val-gatos">0</span>
                        <button onclick="changeCount('gatos', 1)">+</button>
                    </div>
                </div>
            </div>
            
            <button class="next-btn" id="btn-next1" onclick="goToStep2()" disabled>Siguiente →</button>
        </div>

        <!-- PASO 2: Resumen y plan -->
        <div id="step2" class="hidden">
            <h2 class="step-title">🧰 Tu plan de emergencia</h2>
            <div id="plan-content"></div>
            <button class="reset-btn" onclick="resetGame()">🔄 Reiniciar</button>
        </div>
    </div>

    <script>
        // ====== ESTADO DEL JUEGO ======
        let family = { adultos: 0, mayores: 0, ninos: 0, perros: 0, gatos: 0 };
        const MAX = 5;
        const DIAS = 4; // hasta 4 días sepultados

        function totalPersonas() {
            return family.adultos + family.mayores + family.ninos;
        }
        function totalMascotas() {
            return family.perros + family.gatos;
        }

        // ====== CONTADORES ======
        function changeCount(tipo, delta) {
            family[tipo] = Math.max(0, Math.min(MAX, family[tipo] + delta));
            document.getElementById('val-' + tipo).textContent = family[tipo];
            // Habilitar "Siguiente" si hay al menos 1 persona
            document.getElementById('btn-next1').disabled = totalPersonas() === 0;
        }

        // ====== NAVEGACIÓN ======
        function goToStep2() {
            document.getElementById('step1').classList.add('hidden');
            document.getElementById('step2').classList.remove('hidden');
            generarPlan();
        }
        function resetGame() {
            family = { adultos: 0, mayores: 0, ninos: 0, perros: 0, gatos: 0 };
            for (let t in family) {
                document.getElementById('val-' + t).textContent = '0';
            }
            document.getElementById('btn-next1').disabled = true;
            document.getElementById('step2').classList.add('hidden');
            document.getElementById('step1').classList.remove('hidden');
        }

        // ====== LÓGICA DE RECURSOS ======
        // Agua: 3 litros por persona/día, 1 litro por mascota/día (perro), 0.5 gato
        function calcularAgua() {
            const litrosPersona = 3 * totalPersonas() * DIAS;
            const litrosPerro = 1 * family.perros * DIAS;
            const litrosGato = 0.5 * family.gatos * DIAS;
            return litrosPersona + litrosPerro + litrosGato;
        }

        // Comida enlatada: 2 latas por persona/día, 1 lata por mascota/día
        function calcularComida() {
            const latasPersona = 2 * totalPersonas() * DIAS;
            const latasMascota = 1 * totalMascotas() * DIAS;
            return latasPersona + latasMascota;
        }

        // Kits sugeridos según composición
        function kitsSugeridos() {
            const kits = [];
            if (family.ninos > 0) kits.push('🧸 Kit infantil: pañales, leche en polvo, juguetes, ropa de repuesto');
            if (family.mayores > 0) kits.push('💊 Kit adultos mayores: medicamentos crónicos, lentes, audífonos, documentos');
            if (family.perros > 0) kits.push('🐕 Kit canino: comida, correa, agua, botiquín');
            if (family.gatos > 0) kits.push('🐈 Kit felino: comida, arenero portátil, transportadora');
            if (family.adultos > 0) kits.push('🧰 Kit general: linterna, radio, botiquín, silbato, dinero en efectivo');
            return kits;
        }

        // ====== RACIONAMIENTO DIARIO ======
        function racionamiento() {
            const filas = [];
            // Ración diaria por persona (en porciones)
            const raciones = [
                { grupo: 'Adultos', racion: '3 comidas/día: 1 plato de comida enlatada + 1 vaso de agua por comida', agua: '3 litros/día' },
                { grupo: 'Adultos mayores', racion: 'Comidas pequeñas y frecuentes (4-5/día). Alimentos suaves y fáciles de masticar', agua: '2.5 litros/día' },
                { grupo: 'Niños', racion: '3 comidas/día en porciones más pequeñas. Priorizar leche y alimentos blandos', agua: '1.5-2 litros/día' },
                { grupo: 'Perros', racion: '1-2 tazas de alimento/día + 1 litro de agua', agua: '1 litro/día' },
                { grupo: 'Gatos', racion: '1 taza de alimento/día + 0.5 litro de agua', agua: '0.5 litro/día' }
            ];
            // Solo mostrar los grupos presentes
            const presentes = [];
            if (family.adultos > 0) presentes.push('Adultos');
            if (family.mayores > 0) presentes.push('Adultos mayores');
            if (family.ninos > 0) presentes.push('Niños');
            if (family.perros > 0) presentes.push('Perros');
            if (family.gatos > 0) presentes.push('Gatos');
            
            raciones.forEach(r => {
                if (presentes.includes(r.grupo)) filas.push(r);
            });
            return filas;
        }

        // ====== GENERAR PLAN ======
        function generarPlan() {
            const personas = totalPersonas();
            const mascotas = totalMascotas();
            const agua = calcularAgua();
            const comida = calcularComida();
            const kits = kitsSugeridos();
            const raciones = racionamiento();

            let html = '';

            // Resumen de la familia
            html += `<div class="info-box good">
                <h3>👨‍👩‍👧‍👦 Tu familia</h3>
                <p>👨 Adultos: <b>${family.adultos}</b> &nbsp;|&nbsp; 👴 Adultos mayores: <b>${family.mayores}</b> &nbsp;|&nbsp; 🧒 Niños: <b>${family.ninos}</b></p>
                <p>🐕 Perros: <b>${family.perros}</b> &nbsp;|&nbsp; 🐈 Gatos: <b>${family.gatos}</b></p>
                <p>Total: <b>${personas}</b> personas y <b>${mascotas}</b> mascotas</p>
            </div>`;

            // Agua y comida
            html += `<div class="summary-grid">
                <div class="info-box">
                    <h3>💧 Agua necesaria</h3>
                    <p style="font-size:1.6rem; text-align:center; color:#4fc3f7;"><b>${agua.toFixed(1)} litros</b></p>
                    <p style="font-size:0.9rem; opacity:0.8; text-align:center;">Para ${DIAS} días (${agua/DIAS} litros/día)</p>
                </div>
                <div class="info-box">
                    <h3>🥫 Comida enlatada</h3>
                    <p style="font-size:1.6rem; text-align:center; color:#ffd166;"><b>${comida} latas</b></p>
                    <p style="font-size:0.9rem; opacity:0.8; text-align:center;">Para ${DIAS} días (${comida/DIAS} latas/día)</p>
                </div>
            </div>`;

            // Kits sugeridos
            html += `<div class="info-box">
                <h3>🎒 Kits sugeridos para tu hogar</h3>`;
            kits.forEach(k => { html += `<p>• ${k}</p>`; });
            html += `</div>`;

            // Botón para crear plan de comidas
            html += `<button class="plan-btn" onclick="togglePlan()">🍽️ Crea tu plan de comidas</button>`;

            // Guía de racionamiento (oculta hasta pulsar el botón)
            html += `<div id="plan-comidas" class="hidden">
                <div class="info-box">
                    <h3>📋 Guía de racionamiento (hasta 4 días sepultado)</h3>
                    <p style="opacity:0.8; margin-bottom:10px;">Raciones diarias sugeridas por miembro, para que el alimento y el agua alcancen:</p>
                    <table>
                        <tr><th>Miembro</th><th>Comida diaria</th><th>Agua diaria</th></tr>`;
            raciones.forEach(r => {
                html += `<tr><td><b>${r.grupo}</b></td><td>${r.racion}</td><td>${r.agua}</td></tr>`;
            });
            html += `</table>
                    <div class="warning" style="margin-top:12px; padding:12px; border-radius:8px;">
                        <p>⚠️ <b>Consejo:</b> raciona el agua en porciones pequeñas a lo largo del día. No la bebas toda de golpe. El cuerpo se adapta mejor a sorbos frecuentes.</p>
                    </div>
                </div>
            </div>`;

            document.getElementById('plan-content').innerHTML = html;
        }

        function togglePlan() {
            const plan = document.getElementById('plan-comidas');
            plan.classList.toggle('hidden');
            // Cambiar texto del botón
            const btn = document.querySelector('.plan-btn');
            btn.textContent = plan.classList.contains('hidden') ? '🍽️ Crea tu plan de comidas' : '📋 Ocultar plan de comidas';
        }
    </script>
</body>
</html>
